<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css" />
    <title>Tribe Crush - Match 3</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="app">
      <!-- HTML Splash Screen -->
      <div id="splash-screen">
        <div class="splash-content">
          <div class="splash-mascot-wrap">
            <img class="splash-mascot" src="/logo.webp" alt="Tribe Crush" />
          </div>
          <div class="splash-title" aria-hidden="true">
            <span>TRIBE</span>
            <strong>CRUSH</strong>
          </div>
          <div class="splash-progress-track">
            <div id="splash-progress"></div>
          </div>
          <div id="splash-text" class="splash-text">LOADING 0%</div>
        </div>
      </div>

      <div id="pixi-container"></div>
    </div>
    <script src="/wink-bridge.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
