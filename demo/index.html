<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#ead9b6" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      as="image"
      href="/assets/backgroud/vietnamese_cultural_landscape_background_1/screen.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />
    <style>
      /* Critical first-paint colors: prevent a black iframe/canvas flash on
         slower phones before the full stylesheet and splash art are ready. */
      html,
      body,
      #app,
      #splash-screen {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: #ead9b6;
      }

      #splash-screen {
        position: absolute;
        inset: 0;
        z-index: 999999;
      }
    </style>
    <link rel="stylesheet" href="/style.css" />
    <title>Tribe Crush - Match 3</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="app">
      <!-- HTML Splash Screen -->
      <div id="splash-screen">
        <div class="splash-content">
          <div class="splash-mascot-wrap">
            <img
              class="splash-mascot"
              src="/logo.webp"
              alt="Tribe Crush"
              fetchpriority="high"
              decoding="async"
            />
          </div>
          <div class="splash-title" aria-hidden="true">
            <span>TRIBE</span>
            <strong>CRUSH</strong>
          </div>
          <div class="splash-progress-track">
            <div id="splash-progress"></div>
          </div>
          <div id="splash-text" class="splash-text">LOADING 0%</div>
        </div>
      </div>

      <div id="pixi-container"></div>
    </div>
    <script src="/wink-bridge.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
